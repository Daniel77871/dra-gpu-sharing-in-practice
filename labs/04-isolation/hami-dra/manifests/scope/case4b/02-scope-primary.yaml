apiVersion: batch/v1
kind: Job
metadata:
  name: scope-primary
  namespace: gpu-isolation-lab
  labels:
    app.kubernetes.io/part-of: dra-book
    app.kubernetes.io/component: scope-primary
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dra-book
        app.kubernetes.io/component: scope-primary
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      resourceClaims:
      - name: gpu
        resourceClaimName: worker-primary-gpu
      containers:
      - name: worker-0
        image: docker.io/pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime@sha256:c8268a92a69bd500f8be0e665b2630ee006dadaf7bfbc24249141b15ff622755
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -u
        - /opt/lab/hami_scope_workload.py
        args:
        - --client-id
        - '0'
        - --control-dir
        - /opt/e2b-control
        env:
        - name: PYTORCH_NO_CUDA_MEMORY_CACHING
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: EXPERIMENT_RUN
          value: __RUN_ID__
        - name: CONTAINER_NAME
          value: worker-0
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 4Gi
          claims:
          - name: gpu
            request: gpu
        volumeMounts:
        - name: code
          mountPath: /opt/lab
          readOnly: true
        - name: control-0
          mountPath: /opt/e2b-control
      volumes:
      - name: code
        configMap:
          name: hami-scope-code
      - name: control-0
        hostPath:
          path: /var/tmp/dra-hami-__RUN_ID__-case4b-r__REPEAT__/0
          type: Directory
