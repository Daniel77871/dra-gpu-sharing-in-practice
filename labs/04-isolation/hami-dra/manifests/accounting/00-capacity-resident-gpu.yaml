apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: capacity-resident-gpu
  namespace: gpu-isolation-lab
  labels:
    app.kubernetes.io/part-of: dra-book
    app.kubernetes.io/component: capacity-resident-gpu
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: hami-core-gpu.project-hami.io
        allocationMode: ExactCount
        count: 1
        selectors:
        - cel:
            expression: 'device.attributes["hami-core-gpu.project-hami.io"].uuid == "GPU-29ffee3e-bee4-e341-917a-fe7e43e977af"'
        capacity:
          requests:
            memory: 16Gi
            cores: 10
