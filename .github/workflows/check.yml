name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies and CJK fonts
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install pinned kustomize
        run: |
          mkdir -p .work/bin
          curl --fail --location --retry 3 'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz' --output "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C .work/bin kustomize
          chmod +x .work/bin/kustomize
          test "$(.work/bin/kustomize version)" = v5.4.3
      - name: Check generated navigation
        run: python tools/build_nav.py --check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check book
        run: |
          python tools/check_book.py
          python tools/extract_references.py --check
      - name: Scan public files
        run: python tools/scan_sensitive.py
